name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore PocketRankingsPlayerProfile.slnx
      - run: dotnet build PocketRankingsPlayerProfile.slnx -c Release --no-restore
      - run: dotnet test PocketRankingsPlayerProfile.slnx -c Release --no-build
      - run: dotnet list src/PocketRankingsPlayerProfile/PocketRankingsPlayerProfile.csproj package --vulnerable --include-transitive
