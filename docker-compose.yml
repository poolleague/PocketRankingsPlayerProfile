name: pocketrankings-player-profile
services:
  player-profile-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: player_profile
      POSTGRES_USER: player_profile
      POSTGRES_PASSWORD: ${PLAYER_PROFILE_POSTGRES_PASSWORD:?Set PLAYER_PROFILE_POSTGRES_PASSWORD}
    volumes: [player-profile-postgres:/var/lib/postgresql/data]
    networks: [player-profile-private]
    restart: unless-stopped
  player-profile-web:
    build: { context: . }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PlayerProfile: Host=player-profile-db;Port=5432;Database=player_profile;Username=player_profile;Password=${PLAYER_PROFILE_POSTGRES_PASSWORD}
    ports: ["127.0.0.1:${PLAYER_PROFILE_HTTP_PORT:-5190}:8080"]
    depends_on: [player-profile-db]
    networks: [player-profile-private]
    restart: unless-stopped
networks:
  player-profile-private:
    name: pocketrankings-player-profile-private
volumes:
  player-profile-postgres:
    name: pocketrankings-player-profile-postgres
